<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" role="img" aria-labelledby="title desc">
  <title id="title">Monsoon Letters</title>
  <desc id="desc">Two glowing windows in a rain-soaked city, with a paper letter between them.</desc>
  <defs>
    <linearGradient id="rain" x2="0" y2="1"><stop stop-color="#10172d"/><stop offset=".54" stop-color="#243b58"/><stop offset="1" stop-color="#101729"/></linearGradient>
    <linearGradient id="window" x2="0" y2="1"><stop stop-color="#ffe8ad"/><stop offset="1" stop-color="#db8058"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="600" height="900" fill="url(#rain)"/>
  <circle cx="166" cy="356" r="82" fill="#ffbd75" opacity=".3" filter="url(#glow)"/><circle cx="433" cy="310" r="82" fill="#ffbd75" opacity=".28" filter="url(#glow)"/>
  <path d="M0 467h195V245h-29v-51h-24v51H97v-74H68v74H0Zm397-35h203V152h-50v68h-27v-93h-35v93h-27v-57h-32v57h-32Z" fill="#111729"/>
