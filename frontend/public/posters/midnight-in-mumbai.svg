<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" role="img" aria-labelledby="title desc">
  <title id="title">Midnight in Mumbai</title>
  <desc id="desc">A warm, cinematic Mumbai skyline beneath a glowing midnight moon.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#11172e"/><stop offset=".58" stop-color="#6e344d"/><stop offset="1" stop-color="#f08b58"/></linearGradient>
    <radialGradient id="moon"><stop stop-color="#ffe6b5"/><stop offset="1" stop-color="#ffb56b" stop-opacity="0"/></radialGradient>
    <linearGradient id="city" x2="0" y2="1"><stop stop-color="#31334d"/><stop offset="1" stop-color="#101321"/></linearGradient>
  </defs>
  <rect width="600" height="900" fill="url(#sky)"/><circle cx="420" cy="245" r="160" fill="url(#moon)"/><circle cx="420" cy="245" r="60" fill="#ffd69a" opacity=".88"/>
