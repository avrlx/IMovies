  <path d="M92 280v156m-59-77h119m341-125v223m-59-112h119" stroke="#172039" stroke-width="9" opacity=".84"/>
  <path d="M0 558c89-20 151 25 244 4s191-31 356 3v335H0Z" fill="#0c1222"/>
  <g stroke="#8cc7df" stroke-width="3" opacity=".45"><path d="m33 40-54 175M121 90 77 233M228 23l-62 206M330 67l-48 155M522 22l-64 190M585 340l-58 179M172 334l-58 178M400 503l-60 176M72 520l-51 151M282 261l-42 139M551 624l-60 186M206 650l-47 157"/></g>
