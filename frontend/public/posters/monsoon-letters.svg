  <text x="47" y="822" fill="#fff5e8" font-family="Georgia,serif" font-size="57">Letters</text>
  <text x="51" y="860" fill="#f0b77e" font-family="Arial,sans-serif" font-size="15" letter-spacing="5">SOME STORIES FIND THEIR WAY</text>
