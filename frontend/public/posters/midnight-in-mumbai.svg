  <text x="46" y="752" fill="#fff7ed" font-family="Georgia,serif" font-size="60" font-weight="bold">MIDNIGHT</text>
  <text x="48" y="816" fill="#fff7ed" font-family="Georgia,serif" font-size="46">IN MUMBAI</text>
